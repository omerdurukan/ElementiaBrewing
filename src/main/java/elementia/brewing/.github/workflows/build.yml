
name: Build ElementiaBrewing

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven ile Derle
        run: mvn --batch-mode --no-transfer-progress package

      - name: JAR Dosyasini Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: ElementiaBrewing
          path: target/ElementiaBrewing-1.0.0.jar
          if-no-files-found: error
